[package]
name = "ninsei"
description = "Cyberspace hacking roguelike dressed as a retro IDE."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ninsei-core.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Location"] }
