[package]
name = "ninsei-term"
description = "A small terminal line editor for ninsei: readline keys, history, search and completion, with an optional egui widget."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The egui line widget. The editor and the key table need nothing.
egui = ["dep:egui"]

[dependencies]
egui = { workspace = true, optional = true }

[dev-dependencies]
# The widget's tests need the widget, also when this crate is tested on its own.
ninsei-term = { path = ".", features = ["egui"] }
