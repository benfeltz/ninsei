<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ninsei</title>
  <meta name="description" content="A cyberspace hacking roguelike dressed as a retro IDE.">
  <style>
    html, body { margin: 0; height: 100%; background: #0b0700; overflow: hidden; }
    canvas#ninsei { display: block; width: 100%; height: 100%; outline: none; }
    #status {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #ffb000; font: 15px/1.5 ui-monospace, "Cascadia Mono", Menlo, monospace;
      white-space: pre; pointer-events: none;
    }
    #status::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <canvas id="ninsei"></canvas>
  <div id="status">ATDT ninsei ... dialing</div>
  <script>
    // The Hosaka's F-key legends use F1, F2, F3, F4, F8, F9 and F10 (help, the Module window's
    // edit, pause, step and run, the menu bar), which a browser might otherwise take. F5, F6,
    // F7, F11 and F12 are left to the browser: F5 still reloads the page.
    window.addEventListener("keydown", (e) => {
      if (["F1", "F2", "F3", "F4", "F8", "F9", "F10"].includes(e.key)) e.preventDefault();
      // While a terminal has the keyboard, its readline chords (Ctrl+A, Ctrl+R, Ctrl+L...)
      // are the game's, not the browser's. The list matches ninsei_term::keys::BROWSER_CTRL.
      if (window.ninseiTyping && e.ctrlKey && !e.metaKey && !e.altKey &&
          "abdefhklpruy".includes(e.key.toLowerCase())) e.preventDefault();
    }, true);
  </script>
  <script type="module">
    import init from "./ninsei.js";
    init().catch((e) => {
      document.getElementById("status").textContent = "NO CARRIER\n" + e;
    });
  </script>
</body>
</html>
